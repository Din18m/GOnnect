root = "."
tmp_dir = ".air-bin"

[build]
  cmd = "go build -o ./.air-bin/main ./cmd"
  entrypoint = ["./.air-bin/main"]
  include_ext = ["go"]
  exclude_dir = [".air-bin", "tmp", "vendor", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "3s"

[log]
  time = false

[misc]
  clean_on_exit = true
